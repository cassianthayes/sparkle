services:
  mc-router:
    image: itzg/mc-router:1.48.0
    container_name: mc-router
    restart: unless-stopped
    environment:
      IN_DOCKER: "true"
      USE_PROXY_PROTOCOL: "true"
    ports: ["25565:25565"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [minecraft]
networks:
  minecraft: { external: true }
